project:
  type: website
  output-dir: _site
  pre-render:
  - python ../scripts/bs_pre_render.py
  resources:
    - assets/logo.svg
    - "assets/icons/**"
    - "assets/social/generated/*.png"
    - assets/bs-glossary.js
    - assets/bs-glossary-lookup.json
    - assets/bs-learn-sequence.json
    - assets/bs-research-sequence.json
    - "assets/positions/**"
    - data/lesson-analysis-svg-mvp.json

filters:
  - bs-link-policy

metadata-files:
  - _learn-navigation.yml

website:
  title: "Technology Commons"
  description: "Course materials, projects, tools, and resources for technology education."
  search:
    location: navbar
    type: overlay
  navbar:
    title: "Technology Commons"
    collapse-below: xl
    left:
      - href: tas2/index.qmd
        text: TAS2
      - href: tej3-4/index.qmd
        text: TEJ3/4
      - href: ttj3-4/index.qmd
        text: TTJ3/4
      - href: tools/index.qmd
        text: Tools
      - href: resources/index.qmd
        text: Resources
      - href: research/index.qmd
        text: Research
    right:
      - href: about.qmd
        text: About
  page-footer:
    left: |
      Technology Commons
    center:
      - text: "Open course materials for technology education"
    right:
      - text: About
        href: /about.html

format:
  html:
    theme: [cosmo, assets/bs-theme.scss]
    css:
      - assets/bs-shared.css
      - assets/bs-components.css
      - assets/bs-learn.css
      - assets/bs-lesson-analysis.css
    include-after-body:
      - includes/bs-scripts.html
    include-in-header:
      - includes/site-head.html
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: false
    code-copy: true

execute:
  freeze: auto

editor: source
