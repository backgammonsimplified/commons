name: Preview logo redesign

on:
  push:
    branches:
      - lore-logo-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      - name: Render site
        run: quarto render site

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: logo-redesign-site
          path: site/_site
          if-no-files-found: error
          retention-days: 3
