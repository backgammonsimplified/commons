name: Preview logo redesign

on:
  push:
    branches:
      - lore-logo-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install PyYAML

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      - name: Render site
        shell: bash
        run: |
          set +e
          quarto render site > /tmp/quarto-render.log 2>&1
          status=$?
          tail -n 250 /tmp/quarto-render.log
          exit $status

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logo-redesign-render-log
          path: /tmp/quarto-render.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload rendered site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: logo-redesign-site
          path: site/_site
          if-no-files-found: error
          retention-days: 3
