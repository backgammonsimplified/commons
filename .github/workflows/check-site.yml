name: Check Quarto site

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      BS_SKIP_SOCIAL_CARDS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Render site
        run: quarto render site
