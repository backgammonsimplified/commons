name: Build Commons brand assets

on:
  workflow_dispatch:
  push:
    branches:
      - branding/commons-logo-asset-kit
    paths:
      - 'favicons_logos_icons/logo/*.svg'
      - 'favicons_logos_icons/logo/site.webmanifest'
      - 'favicons_logos_icons/emblem/*.svg'
      - 'favicons_logos_icons/generate_brand_assets.py'
      - '.github/workflows/build-brand-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branding/commons-logo-asset-kit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: pip install cairosvg pillow ezdxf svgpathtools
      - name: Generate raster exports
        run: python favicons_logos_icons/generate_brand_assets.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicons_logos_icons
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate Commons branding raster assets"
            git push origin HEAD:branding/commons-logo-asset-kit
          fi
